version: "3.8"

services:
  # Laravel Backend API
  backend:
    build:
      context: ./backend
      dockerfile: ./docker/Dockerfile
    container_name: finpoint-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finpoint-net

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: finpoint-db
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: finpoint
      MYSQL_USER: finpoint_user
      MYSQL_PASSWORD: finpoint_pass
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finpoint-net

  # phpMyAdmin
  phpmyadmin:
    image: phpmyadmin:5
    container_name: finpoint-pma
    ports:
      - "8082:8082"
    environment:
      PMA_HOST: db
      PMA_USER: finpoint_user
      PMA_PASSWORD: finpoint_pass
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finpoint-net

  # Vue.js Frontend
  web:
    container_name: finpoint-web
    build:
      context: ./frontend
      dockerfile: ./docker/Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/var/www/html
      - frontend-node_modules:/var/www/html/node_modules
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - finpoint-net

volumes:
  db-data:
  frontend-node_modules:

networks:
  finpoint-net:
    driver: bridge
